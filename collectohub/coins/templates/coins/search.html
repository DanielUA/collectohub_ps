{% extends 'coins/base.html' %} 
{% block title %} 
    search
{% endblock %} 
{% block content %}
<h3> search by "{{ pattern }}" </h3>
<p> Found: {{ coin_list.count }} </p>
<div class="row">
    {% for coin in coin_list %}
        {% include 'coins/elements/coin_card.html' with coin=coin %}
    {% endfor %}
</div>
{% endblock %}
